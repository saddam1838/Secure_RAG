events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name secure-rag.saddam.dev;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name secure-rag.saddam.dev;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 50M;

        location / {
            set $upstream_app app;
            proxy_pass http://$upstream_app:7860;
            
            # 🔥 CRITICAL FOR SUB_FILTER: Force uncompressed HTML from upstream
            proxy_set_header Accept-Encoding "";
            
            # 🔥 INJECT IOS POLYFIX
            sub_filter '</head>' '<script src="https://cdn.jsdelivr.net/npm/urlpattern-polyfill@1.0.14/dist/urlpattern-polyfill.min.js"></script></head>';
            sub_filter_once on;
            sub_filter_types text/html;

            # Standard Gradio WebSocket config
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 75s;
        }
    }
}
